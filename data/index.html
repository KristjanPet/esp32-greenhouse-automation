<!DOCTYPE html>
    <html lang="sl">
    <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta charset="UTF-8">
      <link rel="stylesheet" href="style.css">
      <title>Nadzor Rastlinjaka</title>
    </head>
    <body onload="loadThresholds()">
      <h1>Nadzorna plošča rastlinjaka</h1>

      <div class="container">
        <div class="section">
          <h2>Status: <span id="motorState">--</span></h2>
          <p><strong>Hitrost vetra:</strong> <span id="wind">--</span> m/s</p>
          <p><strong>Temperatura senzor 1:</strong> <span id="temp1">--</span> &deg;C</p>
          <p><strong>Temperatura senzor 2:</strong> <span id="temp2">--</span> &deg;C</p>
          <p><strong>Povprečna temperatura:</strong> <span id="avg">--</span> &deg;C</p>
          <p><strong>Vlaga:</strong> <span id="humidity">--</span> &deg;C</p>
        </div>

        <div class="section">
          <h2>Ročni nadzor motorjev</h2>
          <button id="btnUp"   class="motor-btn" onclick="sendMotorCommand('up')">Gor</button>
          <button id="btnDown" class="motor-btn" onclick="sendMotorCommand('down')">Dol</button>

          <p id="manualLockNote" style="display:none; color:#b71c1c; font-weight:600;">
            Ročni nadzor je aktiven – gumbi so zaklenjeni.
          </p>
        </div>

        <div class="section">
          <h2>Nastavitve pragov</h2>
          <p>
            <label><input id="useTempOpen" type="checkbox" checked>Temp odpri: <input id="tempOpen" type="number" value="25"></label>
            <label><input id="useTempClose" type="checkbox" checked>Temp zapri: <input id="tempClose" type="number" value="18"></label>
          </p>
          <p>
            <label><input id="useWindClose" type="checkbox" checked>Veter zapri: <input id="windClose" type="number" value="10"></label>
            <label><input id="useWindReopen" type="checkbox" checked>Veter odpri: <input id="windReopen" type="number" value="6"></label>
          </p>
          <button onclick="sendThresholds()">Shrani prage</button>
        </div>
      </div>
      <div class="section">
        <h2>Dnevnik premikov</h2>
        <pre id="logBox" style="max-height:240px; overflow:auto; background:#f7f7f7; padding:10px; border-radius:6px;"></pre>
      </div>

        <script src="main.js"> </script>
    </body>
    </html>
